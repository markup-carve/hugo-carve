name: Release packages and assets

# Go modules have no registry step: the module proxy serves them straight from
# the git tag, so pushing the tag IS the publish and nothing here can gate it.
# What this workflow gates is everything that is still in its own hands - that
# the tag agrees with the CHANGELOG, that a human wrote release notes, and that
# the tagged tree builds and passes its tests - and then it does the one thing
# that was being done by hand: publish the notes.
#
# v0.1.1 was tagged with no workflow in the repository at all. Nothing ran, and
# its release had to be published by hand.

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `write`, not `read`, for two reasons. It is what publishes the release
      # at the end, and a DRAFT release is invisible to a caller without push
      # access - so under `contents: read` the listing comes back without it
      # and the gate below reports "no release" for a draft sitting right there
      # with notes in it. See markup-carve/carve-wasm#80.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # So the ancestry check below has main to compare against.
          fetch-depth: 0

          ref: ${{ inputs.source_sha }}
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: Verify the release tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag $LANE_TAG is not on the main line"
            exit 1
          fi

      # GATE: the tag and the CHANGELOG agree.
      #
      # There is no version constant anywhere in this repository - no `-version`
      # flag, no `const Version`, nothing in go.mod - so the tag is the only
      # version surface, and the CHANGELOG heading is the only other place the
      # number is written down. This is the whole of the version check that
      # sibling repositories spend two steps on.
      #
      # The pattern accepts this repository's own `## v0.1.1 - <date>` form as
      # well as the bracketed `## [0.1.1]` the other repositories use, rather
      # than imposing one on the other. The trailing class rejects a longer
      # number, so a 0.1.1 tag is not satisfied by a 0.1.11 section.
      - name: The CHANGELOG has a section for this tag
        run: |
          ver="${LANE_TAG#v}"
          if ! grep -qE "^## \[?v?${ver//./\\.}\]?([^0-9.]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $ver; cut it before tagging"
            exit 1
          fi
          grep -m1 -E "^## \[?v?${ver//./\\.}\]?([^0-9.]|$)" CHANGELOG.md

      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Slurped with `jq -s`, not with `gh --jq`: `gh api --paginate`
          # applies its own `--jq` to EACH PAGE, so past one page of releases
          # the filter emits one result per page instead of one result.
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -s --arg tag "$LANE_TAG" \
                '[.[][] | select(.tag_name == $tag)] | first')"
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "::error::no release for $LANE_TAG. Write the notes first:" \
                 "gh release create $LANE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $LANE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'
          printf '%s' "$release" | jq -er '.id' > "$RUNNER_TEMP/release-id"

        if: ${{ inputs.publish }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build ./...

      # The same command ci.yml's build-test job runs, and deliberately without
      # CARVE_SPEC_CORPUS. The corpus job gates on the DIFFERENCE between the
      # pinned carve-go and carve-go main, which is a moving external target: a
      # tag that was fine an hour ago would start failing on an upstream commit
      # nobody here pushed. A gate that a release cannot clear by its own
      # contents gets switched off, which is how checks go dead
      # (markup-carve/carve#755). Drift stays in ci.yml and engine-drift.yml,
      # where a pull request can act on it.
      - name: Test
        run: go test ./...

      # The manual step tonight's release round exposed. A tag with no release
      # page gives a reader no notes and no changelog for the version they just
      # got from the proxy.
      #
      # Last, deliberately: a draft that stays a draft is recoverable.
      - name: Warm the Go module proxy
        continue-on-error: true
        run: |
          url="https://proxy.golang.org/github.com/markup-carve/hugo-carve/@v/${LANE_TAG}.info"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$url"; then
              echo
              echo "the proxy serves $LANE_TAG"
              exit 0
            fi
            echo "attempt $attempt: the proxy does not serve $LANE_TAG yet"
            sleep 20
          done
          echo "::warning::the proxy did not serve $LANE_TAG within about two minutes." \
               "This does not invalidate the release - population is lazy and the next" \
               "go get triggers it."
        if: ${{ inputs.publish }}
permissions:
  contents: write
  actions: read
  id-token: write
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
