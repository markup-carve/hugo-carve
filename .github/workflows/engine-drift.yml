name: Engine drift

# This repo renders with an engine it never builds, two pins deep and both
# invisible from here: go.mod pins a carve-go pseudo-version, and that carve-go
# embeds a prebuilt `.wasm` compiled from some carve-rs commit. Neither moves on
# its own, and until this file existed nothing here compared either to anything
# (carve#735).
#
# THREE QUESTIONS, deliberately kept apart.
#
#   1. Where is the go.mod pin against carve-go `main`? A version string, and
#      the cheap half of the answer.
#
#   2. What did that carve-go BUILD ITS ENGINE FROM? carve-go records it in
#      `internal/wasm/REV` (markup-carve/carve-go#24) and, until this job, no
#      consumer ever read it back. A recorded provenance nothing reads is not
#      traceability - it is a comment. This resolves the pinned carve-go's REV
#      against carve-rs `main` and reports the distance.
#
#   3. What does the pin COST, in documents? A commit distance is a proxy: 200
#      carve-rs commits can change nothing and one can change a construct. So
#      the corpus is driven through Convert twice - once with the pinned
#      carve-go, once with carve-go `main` - and the DIFFERENCE between the two
#      counts is the divergence this repository can actually fix.
#
# That difference is the gate, and it is the only thing here that fails. The
# residual count - documents that diverge with carve-go `main` too - is
# carve-go's embedded wasm trailing carve-rs, which is markup-carve/carve-go's
# own corpus gate to answer and cannot be fixed from this repository. Failing on
# it would put this job permanently red for someone else's lag, which is how a
# job gets ignored.

on:
  schedule:
    # 05:25 UTC daily, alongside the other drift runs in the org.
    #
    # THE MINUTE IS NOT THE POINT; REWRITING THIS LINE IS. Between landing on
    # 2026-08-06 and 2026-08-17 this workflow produced exactly one run, and that
    # run was the workflow_dispatch fired when the file merged. Not one
    # scheduled run in eleven days, while the pin it would have caught cost 166
    # documents (hugo-carve#7).
    #
    # The cause was NOT determined. Everything checkable is normal and matches
    # the siblings whose crons do fire: the workflow reports state=active, the
    # repository is not a fork and not archived, Actions are enabled with
    # allowed_actions=all, the file is on the default branch, it is plain ASCII
    # with no BOM, and workflow_dispatch on this same `on:` block works. Twelve
    # other repositories in the org carry the byte-identical expression
    # `0 5 * * *` and every one of them fires daily, so the expression and the
    # contended top-of-the-hour slot are ruled out as the cause too.
    #
    # What is left is the registration itself, and the only lever this
    # repository has over it is to commit a change to the cron setting, which is
    # what registers a schedule in the first place. So this line is rewritten,
    # deliberately, and off the hour boundary while it is being touched since
    # GitHub drops the most heavily contended minutes first. Treat it as the
    # available lever rather than a diagnosis: the next scheduled window is the
    # test, and if it stays silent the answer is not in this file.
    - cron: "25 5 * * *"
  workflow_dispatch:

jobs:
  engine-pin:
    name: The pin, and what it was built from
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out carve-go
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-go
          path: carve-go
          fetch-depth: 0

      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      - name: Compare the go.mod pin against carve-go main
        run: |
          set -euo pipefail
          # Matches both go.mod spellings - a bare `require <mod> <ver>` line
          # and an indented line inside a `require (...)` block. An awk keyed on
          # $1 reads only the block form, and silently yields the empty string
          # for the bare one this repo actually uses.
          version="$(grep -oE 'github\.com/markup-carve/carve-go v[^ ]+' go.mod | head -1 | awk '{print $2}')"
          if [ -z "${version}" ]; then
            echo "::error::github.com/markup-carve/carve-go is not required by go.mod - this workflow is watching nothing"
            exit 1
          fi
          echo "go.mod requires ${version}"

          # A pseudo-version ends in -<12-hex>; a tagged release does not, and
          # carve-go has never tagged one, so anything else here is a surprise
          # worth failing on rather than guessing about.
          rev="${version##*-}"
          if ! printf '%s' "${rev}" | grep -qE '^[0-9a-f]{12}$'; then
            echo "::error::${version} does not end in a 12-hex pseudo-version revision, so the commit it came from cannot be identified"
            exit 1
          fi
          if ! git -C carve-go cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::go.mod pins carve-go ${rev}, which is not a commit in markup-carve/carve-go"
            exit 1
          fi
          if ! git -C carve-go merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::carve-go ${rev} is not on main, so the engine came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-go rev-list --count "${rev}..origin/main")"
          echo "carve-go pin: ${rev} ($(git -C carve-go log -1 --format=%s "${rev}"))"
          echo "carve-go main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the carve-go pin is ${behind} commit(s) behind carve-go main"
          fi
          echo "CARVE_GO_REV=${rev}" >> "${GITHUB_ENV}"

      - name: Read the engine revision the pinned carve-go recorded
        run: |
          set -euo pipefail
          # carve-go writes internal/wasm/REV from build-wasm.sh so the embedded
          # engine can be traced to a carve-rs commit. Nothing downstream ever
          # read it. This is that reader.
          engine="$(git -C carve-go show "${CARVE_GO_REV}:internal/wasm/REV" 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "${engine}" ]; then
            echo "::error::carve-go ${CARVE_GO_REV} records no internal/wasm/REV, so what this repo renders with cannot be traced to a carve-rs commit"
            exit 1
          fi
          if ! git -C carve-rs cat-file -e "${engine}^{commit}" 2>/dev/null; then
            echo "::error::carve-go ${CARVE_GO_REV} records engine ${engine}, which is not a commit in markup-carve/carve-rs"
            exit 1
          fi
          if ! git -C carve-rs merge-base --is-ancestor "${engine}" origin/main; then
            echo "::error::engine ${engine} is not on carve-rs main, so the embedded wasm came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-rs rev-list --count "${engine}..origin/main")"
          echo "embedded engine: carve-rs ${engine} ($(git -C carve-rs log -1 --format=%s "${engine}"))"
          echo "carve-rs main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the engine this repo renders with is carve-rs ${engine}, ${behind} commit(s) behind carve-rs main - refreshing it is markup-carve/carve-go's build-wasm.sh, not a change here"
          fi

  corpus:
    name: What the pin costs, in documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check out the corpus from carve main
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: carve-main

      # One script, two callers. ci.yml runs this same comparison on push and
      # pull_request, where it blocks a merge; this scheduled run catches the
      # case that has no push here at all - carve-go publishes a new wasm and
      # this pin becomes costly without a single commit in this repository.
      #
      # It used to be two inline steps handing a count between them through
      # GITHUB_OUTPUT. Copying that into ci.yml would have been a second
      # spelling of one rule, and the two would drift.
      - name: The corpus, through the pin and through carve-go main
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/carve-main/tests/corpus
        run: scripts/corpus-drift.sh
